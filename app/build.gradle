apply plugin: 'com.android.application'

android {
    namespace 'com.mytv.lite'
    compileSdk 34

    defaultConfig {
        applicationId "com.mytv.lite"
        // 兼容线：最低支持 Android 4.1 (API 16)，覆盖 4.1 ~ 4.3 的老盒子
        minSdk 16
        // 老设备用 targetSdk 28：可继续使用传统存储、无分区存储/通知权限等新限制
        targetSdk 28
        versionCode 7
        versionName "1.0.6"

        // ExoPlayer + AppCompat 方法数超过 64K，API 21 以下都需要 legacy multidex
        multiDexEnabled true

        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            storeFile file("mytv-lite.jks")
            storePassword "mytvlite"
            keyAlias "mytvlite"
            keyPassword "mytvlite"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/*.kotlin_module']
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "MyTVLite-${variant.versionName}-sdk16-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ExoPlayer 2.x 是最后一个仍支持 API 16+ 的版本线（media3 需要 API 21+）
    implementation 'com.google.android.exoplayer:exoplayer-core:2.18.7'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.18.7'

    // OkHttp 3.x 支持 API 9+（4.x 需要 API 21+），并自带 TLS1.2 支持
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
}
